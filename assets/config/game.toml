# KrunkNative gameplay configuration.
#
# Weapons and classes are defined by NAME inside the [weapons] and [classes]
# tables. The section key determines which built-in weapon/class is being
# configured (weapon indices are preserved internally).
#
# Any field omitted keeps the hard-coded default from src/shared. Asset paths
# (model/texture/sound) are resolved relative to the assets directory; set a
# section-scoped directory with `weapons-dir` / `classes-dir` if desired.

